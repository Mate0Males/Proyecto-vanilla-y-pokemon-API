spring.application.name=gestor-tareas

# Conexión a tu base de datos PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/gestor_tareas_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Hibernate creará/actualizará las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inicialización opcional de datos si usas data.sql
spring.sql.init.mode=always