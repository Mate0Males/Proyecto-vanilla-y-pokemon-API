version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-container
    environment:
      POSTGRES_DB: gestor_tareas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - pokemon-net
    restart: always

  pokemon-app:
    image: mateomales/pokemon-app:latest
    container_name: pokemon-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-container:5432/gestor_tareas_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
    depends_on:
      - postgres-db
    networks:
      - pokemon-net
    restart: always

networks:
  pokemon-net:
    driver: bridge